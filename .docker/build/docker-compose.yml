services:
    cednet_driver:
        image: docker-registry.grupocednet.com.br/cednet-driver:1.0
        build:
            dockerfile: Dockerfile
            args:
                - GIT_VERSION=v1.0
                - APP_NAME="Cednet Driver"
            ssh:
                - default
        secrets:
            - ssh_key

secrets:
    ssh_key:
        file: ~/.ssh/id_rsa
