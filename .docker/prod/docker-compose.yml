services:
    drive-tools:
        image: drive-tools:1.0
        build:
            context: ../../
            dockerfile: .docker/prod/Dockerfile
            args:
                - APP_URL=http://172.16.254.50:8082
        networks:
            - drive-tools-network
        volumes:
            - drive-tools-files:/var/www/html
            - /storage/cednet-applicacoes/driver-tool-dev:/storage/cednet-applicacoes/driver-tool-dev
        environment:
            - APP_NAME='Driver Tools'
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_URL=http://172.16.254.50:8082
            - DB_HOST=drive-tools-database
            - DB_PORT=3306
            - DB_DATABASE=driver_tools
            - DB_USERNAME=driver_tools
            - DB_PASSWORD=@DitCD34a9
            - DRIVER_STORAGE_PATH=/storage/cednet-applicacoes/driver-tool-dev

    drive-tools-database:
        image: mysql:8.4
        networks:
            - drive-tools-network
        environment:
            - MYSQL_ROOT_PASSWORD=@Bw37!Xy29%
            - MYSQL_DATABASE=driver_tools
            - MYSQL_USER=driver_tools
            - MYSQL_PASSWORD=@DitCD34a9
        volumes:
            - drive-tools-database:/var/lib/mysql

    drive-tools-server:
        image: nginx:latest
        ports:
            - 8082:80
        networks:
            - drive-tools-network
        volumes:
            - drive-tools-files:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
    drive-tools-files:
    drive-tools-database:

networks:
    drive-tools-network:
        driver: bridge
