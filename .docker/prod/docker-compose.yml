services:
    drive-tools:
        image: drive-tools:1.0
        build:
            context: ../../
            dockerfile: .docker/prod/Dockerfile
            args:
                - APP_URL=http://172.16.254.50:8082
        networks:
            - drive-tools-network
        volumes:
            - drive-tools-files:/var/www/html
            - /storage/cednet-applicacoes/driver-tool-dev:/storage/cednet-applicacoes/driver-tool-dev
        environment:
            - APP_URL=http://172.16.254.50:8082
            - DRIVER_STORAGE_PATH=/storage/cednet-applicacoes/driver-tool-dev

    drive-tools-server:
        image: nginx:latest
        ports:
            - 8082:80
        networks:
            - drive-tools-network
        volumes:
            - drive-tools-files:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
    drive-tools-files:

networks:
    drive-tools-network:
        driver: bridge
