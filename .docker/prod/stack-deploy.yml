services:
  drive-tools:
    image: drive-tools:1.0
    networks:
      - drive-tools-network
    volumes:
      - drive-tools-files:/var/www/html
      - /storage/cednet-applicacoes/driver-tool-dev:/storage/cednet-applicacoes/driver-tool-dev
    environment:
      - APP_NAME='Driver Tools'
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_TIMEZONE=America/Sao_Paulo
      - APP_URL=https://drive.host.com.br
      - DB_HOST=drive-tools-database
      - DB_PORT=3306
      - DB_DATABASE=driver_tools
      - DB_USERNAME=driver_tools
      - DB_PASSWORD=pass
      - DRIVER_STORAGE_PATH=/storage/cednet-applicacoes/driver-tool-dev
      - PHP_MAX_EXECUTION_TIME=60
      - PHP_MAX_INPUT_TIME=60
      - PHP_POST_MAX_SIZE=20G
      - PHP_UPLOAD_MAX_FILESIZE=20G
      - PHP_MAX_FILE_UPLOADS=20
      - PHP_MEMORY_LIMIT=-1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - drive-tools-database

  drive-tools-database:
    image: mysql:8.4
    networks:
      - drive-tools-network
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=driver_tools
      - MYSQL_USER=driver_tools
      - MYSQL_PASSWORD=pass
    volumes:
      - drive-tools-database:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  drive-tools-server:
    image: nginx:latest
    ports:
      - 8082:80
    networks:
      - drive-tools-network
    volumes:
      - drive-tools-files:/var/www/html
      - /apps/drive-tools:/etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - drive-tools

volumes:
  drive-tools-files:
  drive-tools-database:

networks:
  drive-tools-network:
    external: true
